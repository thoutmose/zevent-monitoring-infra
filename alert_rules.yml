groups:
  - name: fleet
    rules:
      # Hosts in the [on_demand] inventory group (see hosts.ini) are only
      # powered on when needed, so their node_exporter being unreachable is
      # expected, not an incident — excluded here rather than skipped from
      # scraping, so metrics still show up on their dashboard whenever they
      # are running.
      - alert: InstanceDown
        expr: up{job="node_exporter", instance!~"srv-dev|srv-staging|srv-prod|srv-db|srv-linux|srv-agentic"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"
          description: "node_exporter on {{ $labels.instance }} has been unreachable for more than 2 minutes."

      - alert: HostHighCpuLoad
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU load on {{ $labels.instance }}"
          description: "CPU busy on {{ $labels.instance }} has been above 90% for 10 minutes (current: {{ printf \"%.1f\" $value }}%)."

      - alert: HostOutOfMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low memory on {{ $labels.instance }}"
          description: "Available memory on {{ $labels.instance }} has been below 10% for 5 minutes (current: {{ printf \"%.1f\" $value }}%)."

      - alert: HostOutOfDiskSpace
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: "Available space on {{ $labels.instance }}:{{ $labels.mountpoint }} has been below 15% for 5 minutes (current: {{ printf \"%.1f\" $value }}%)."

      - alert: HostHighLoad
        expr: node_load5 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High load average on {{ $labels.instance }}"
          description: "5-minute load average per core on {{ $labels.instance }} has been above 1.5 for 10 minutes (current: {{ printf \"%.2f\" $value }})."

      - alert: HostReboot
        expr: (time() - node_boot_time_seconds) < 10 * 60
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.instance }} rebooted"
          description: "{{ $labels.instance }} came back up less than 10 minutes ago."

      # node_reboot_required and apt_upgrades_pending aren't built into
      # node_exporter — the node_exporter role writes them via a textfile
      # collector script (checks /run/reboot-required and `apt-get
      # --just-print dist-upgrade`), refreshed on a timer and right after
      # unattended-upgrades runs.
      - alert: HostRebootRequired
        expr: node_reboot_required == 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Reboot required on {{ $labels.instance }}"
          description: "A package update on {{ $labels.instance }} requires a reboot to take effect."

      - alert: HostAptUpgradesPending
        expr: apt_upgrades_pending > 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Package upgrades pending on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has had {{ printf \"%.0f\" $value }} pending apt upgrade(s) for over an hour."

      # cAdvisor down means per-container metrics/dashboards for that host
      # are blind, even though the host itself (node_exporter) may be fine.
      - alert: CadvisorDown
        expr: up{job="cadvisor", instance!~"srv-dev|srv-staging|srv-prod|srv-db|srv-linux|srv-agentic"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "cAdvisor unreachable on {{ $labels.instance }}"
          description: "Container-level metrics for {{ $labels.instance }} have been unavailable for 5 minutes."

      - alert: ProbeFailure
        expr: probe_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is not responding"
          description: "Blackbox probe of {{ $labels.instance }} has failed for more than 5 minutes."

      - alert: ProbeSlowResponse
        expr: probe_duration_seconds > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is responding slowly"
          description: "Blackbox probe of {{ $labels.instance }} has taken more than 2s to respond for 10 minutes (current: {{ printf \"%.2f\" $value }}s)."

      # Doesn't test anything by itself — always firing. Alertmanager pings
      # the dead-man's-switch URL every time this fires/repeats (see the
      # dedicated route in alertmanager.yml.j2); the external service pages
      # if the pings *stop*, which is the only way to notice srv-monitoring
      # itself going dark — everything else in this file can only alert
      # about targets *other than* the box it's running on.
      - alert: Watchdog
        expr: vector(1) == 1
        labels:
          severity: none
        annotations:
          summary: "Dead-man's-switch heartbeat"
          description: "Always firing by design — drives the external dead-man's-switch ping. If you see this alert itself stop, Alertmanager is the thing that's broken."

  # zevent project: PostgreSQL on srv-db, covering both the "zevent" (prod)
  # and "zevent-dev" (dev) databases on that one instance. Scoped to
  # datname=~"zevent.*" throughout so these never fire on unrelated
  # databases (postgres, template0/1, etc.) that happen to share the host.
  - name: zevent-postgres
    rules:
      - alert: PostgresDown
        expr: pg_up{instance="srv-db"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL on {{ $labels.instance }} is down"
          description: "postgres_exporter reports PostgreSQL on {{ $labels.instance }} unreachable for more than 2 minutes — both zevent and zevent-dev are affected."

      - alert: PostgresConnectionsHigh
        expr: sum by (instance) (pg_stat_database_numbackends{instance="srv-db",datname=~"zevent.*"}) / on(instance) pg_max_connections_max_connections{instance="srv-db"} * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections high on {{ $labels.instance }}"
          description: "zevent + zevent-dev connections have used more than 80% of max_connections on {{ $labels.instance }} for 5 minutes (current: {{ printf \"%.1f\" $value }}%)."

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks{instance="srv-db",datname=~"zevent.*"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Deadlock detected on {{ $labels.datname }}"
          description: "{{ $labels.datname }} on {{ $labels.instance }} has had at least one deadlock in the last 5 minutes."

      - alert: PostgresLowCacheHitRatio
        expr: |
          sum by (datname) (pg_stat_database_blks_hit{instance="srv-db",datname=~"zevent.*"})
          /
          (sum by (datname) (pg_stat_database_blks_hit{instance="srv-db",datname=~"zevent.*"}) + sum by (datname) (pg_stat_database_blks_read{instance="srv-db",datname=~"zevent.*"}))
          * 100 < 80
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Low cache hit ratio on {{ $labels.datname }}"
          description: "Cumulative buffer cache hit ratio for {{ $labels.datname }} (pg_stat_database, since last stats reset) has been below 80% for 15 minutes (current: {{ printf \"%.2f\" $value }}%) — can indicate memory pressure on srv-db. This moves slowly by design; for a fast-reacting real-time signal during an active event, see PostgresBgwriterBackendRatioHigh below."

      # Matches the bgwriter:backend ratio observed during the 2026-09-05
      # incident (~21:1 before the fix, ~8.6:1 after). Distinct from
      # PostgresBackendBufferWritesHigh below (share of *total* buffers
      # written by backends) — this one tracks backend writes directly
      # against bgwriter's routine cleaning, which is what actually moved
      # during today's fix.
      - alert: PostgresBgwriterBackendRatioHigh
        expr: |
          rate(pg_stat_bgwriter_buffers_backend_total{instance="srv-db"}[5m])
          /
          (rate(pg_stat_bgwriter_buffers_clean_total{instance="srv-db"}[5m]) + 1e-9) > 15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Backend buffer writes far outpacing bgwriter on {{ $labels.instance }}"
          description: "Backends have written more than 15x as many buffers as bgwriter's routine cleaning, sustained for 15 minutes on {{ $labels.instance }} (current ratio: {{ printf \"%.1f\" $value }}:1) — bgwriter_lru_maxpages is likely undersized again for the current ingestion rate; affects zevent and zevent-dev together."

      # Live pg_stat_activity/pg_stat_bgwriter checks, added to catch IO
      # contention or a dragging checkpoint in real time during an ingestion
      # spike (see pg_wait_events/pg_io_wait_events/pg_blocked_queries in
      # roles/db_tools/files/postgres_exporter_queries.yaml). The
      # bgwriter/checkpoint metrics are instance-wide (no datname) — the
      # checkpointer is shared by the whole srv-db cluster, so these affect
      # zevent and zevent-dev together.
      - alert: PostgresIOContentionHigh
        expr: sum by (datname) (pg_wait_events_backends{instance="srv-db",datname=~"zevent.*",wait_event_type="IO"}) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Backends stuck on IO wait on {{ $labels.datname }}"
          description: "More than 5 backends on {{ $labels.datname }} have been waiting on an IO wait_event for over 2 minutes (current: {{ $value }}) — check pg_io_wait_events_backends on the dashboard for which IO event, and node_exporter disk latency on srv-db."

      - alert: PostgresBlockedQueries
        expr: pg_blocked_queries_blocked_backends{instance="srv-db",datname=~"zevent.*"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Backends blocked on a lock on {{ $labels.datname }}"
          description: "{{ $labels.datname }} has had at least one backend waiting on a lock for 2+ minutes (current: {{ $value }}) — see pg_blocked_queries_max_wait_seconds for how long the oldest wait has run."

      - alert: PostgresCheckpointDragging
        expr: |
          (increase(pg_stat_bgwriter_checkpoint_write_time_total{instance="srv-db"}[5m]) + increase(pg_stat_bgwriter_checkpoint_sync_time_total{instance="srv-db"}[5m])) / 1000 / 300 * 100 > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL checkpoint I/O is dragging on {{ $labels.instance }}"
          description: "The checkpointer on {{ $labels.instance }} has spent more than 50% of the last 5 minutes writing/syncing checkpoint data (current: {{ printf \"%.1f\" $value }}%) — likely IO-bound during an ingestion spike; affects both zevent and zevent-dev."

      - alert: PostgresConflictsDetected
        expr: increase(pg_stat_database_conflicts{instance="srv-db",datname=~"zevent.*"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Recovery conflict detected on {{ $labels.datname }}"
          description: "{{ $labels.datname }} on {{ $labels.instance }} has had at least one recovery conflict (lock/snapshot/bufferpin/tablespace/logical-slot) in the last 5 minutes — should stay at 0 in continuous operation."

      - alert: PostgresBackendBufferWritesHigh
        expr: |
          rate(pg_stat_bgwriter_buffers_backend_total{instance="srv-db"}[5m])
          /
          (rate(pg_stat_bgwriter_buffers_backend_total{instance="srv-db"}[5m]) + rate(pg_stat_bgwriter_buffers_checkpoint_total{instance="srv-db"}[5m]) + rate(pg_stat_bgwriter_buffers_clean_total{instance="srv-db"}[5m]) + 1e-9)
          * 100 > 20
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Backends are flushing their own dirty buffers on {{ $labels.instance }}"
          description: "Backends have written more than 20% of dirty buffers themselves (bypassing bgwriter/checkpointer) for 10 minutes on {{ $labels.instance }} (current: {{ printf \"%.1f\" $value }}%) — a classic sign the checkpointer can't keep up with the current write/ingestion load."
